<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles.css" />
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        outline: 0;
        font-family: 'Souice Sans Pro', Sans-Serif;
      }

      body {
        background-color: #383838;
        background-position: center;
        background-size: cover;
      }

      div#container {
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      div#container section {
        display: flex;
        justify-content: space-between;
        width: 85%;
        max-width: 960px;
        background-color: rgba(255, 255, 255, 0.9);
        border-radius: 30px;
        box-shadow: 0 2px 5px 0 #454545;
        padding: 30px;
      }

      div#container section article {
        width: 45%;
        background-color:rgb(198, 38, 198);
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 15px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      div#container section article h1 {
        font-size: 40px;
        font-weight: 700;
        color:white;
      }

      div#container section article p {
        font-size: 18px;
        color: white;
        margin-top: 10px;
      }

      div#container section article a.btn {
        display: inline-block;
        padding: 10px 30px;
        border:white solid 2px;
        border-radius: 25px;
        font-size: 18px;
        text-decoration: none;
        margin-top: 30px;
        font-weight: 600;
        color: black;
        transition: 0.2s all ease;
      }

      div#container section article a.btn:hover {
        background-color: black;
        color:rgb(198, 38, 198);
      }

      div#container section aside {
        width: 55%;
        padding-left: 30px;
      }

      div#container section aside h2 {
        font-size: 36px;
        color: #282828;
        font-weight: 700;
        margin-bottom: 20px;
      }

      div#container section aside p {
        font-size: 16px;
        color: #282828;
        margin-bottom: 20px;
      }

      nav#sociallogin {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 15px 0;
      }

      nav#sociallogin a {
        width: 50px;
        height: 50px;
        background-color: white;
        margin: 0 10px;
        border-radius: 100%;
        background-position: center;
        background-repeat: no-repeat;
        background-size: 60%;
      }

      form {
        margin-top: 30px;
        max-width: 350px;
        margin: 30px auto 0 auto;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      form input[type="text"],
      form input[type="email"],
      form input[type="password"] {
        width: 100%;
        padding: 12px 15px;
        margin-bottom: 20px;
        font-size: 18px;
        border-radius: 25px;
        border: 1px solid #ccc;
        box-sizing: border-box;
      }

      form input[type="text"]:focus,
      form input[type="email"]:focus,
      form input[type="password"]:focus {
        border-color:rgb(198, 38, 198);
        outline: none;
      }

      form button[type="submit"] {
        border: none;
        background-color:rgb(198, 38, 198);
        font-size: 20px;
        font-weight: 600;
        padding: 12px 25px;
        border-radius: 25px;
        transition: 0.2s all ease;
        cursor: pointer;
      }

      form button[type="submit"]:hover {
        background-color: black;
        color:rgb(198, 38, 198);
      }

      form p {
        font-size: 14px;
        text-align: center;
        color: #777;
      }
       .form-text {
        font-size: 14px;
        text-align: center;
        color: #777;
      }
         nav#sociallogin a.google
      {
        background-size:50px;
      }
      nav#sociallogin a.github
      {
        background-size: 40px;
      }
      nav#sociallogin a.linkedin
      {
        background-size:70px ;
      }
    </style>
  </head>
