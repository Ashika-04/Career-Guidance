<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #ddd;
            border-radius: 10px;
            display: flex;
            width: 800px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        .left-panel {
            background: #c600c6;
            color: white;
            padding: 50px;
            flex: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .left-panel h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .left-panel p {
            font-size: 14px;
            margin-bottom: 20px;
        }
        .left-panel button {
            background: transparent;
            border: 2px solid white;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
        }
        .left-panel button:hover {
            background: white;
            color: #c600c6;
        }
        .right-panel {
            background: white;
            padding: 50px;
            flex: 1;
            text-align: center;
        }
        h2 {
            margin-bottom: 15px;
            color: #333;
        }
        .social-icons {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }
        .social-icons img {
            width: 30px;
            margin: 0 10px;
            cursor: pointer;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 20px;
            font-size: 14px;
        }
        .signin-btn {
            width: 100%;
            padding: 12px;
            background-color: #c600c6;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 10px;
        }
        .signin-btn:hover {
            background-color: #a300a3;
        }
        .signup-link {
            margin-top: 15px;
            font-size: 14px;
        }
        .signup-link a {
            color: #c600c6;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <h2>Welcome Back</h2>
            <p>To stay connected with us, please sign in with your details.</p>
            <button onclick="window.location.href='signup.html'">Sign Up</button>
        </div>
        <div class="right-panel">
            <h2>Sign In</h2>
            <div class="social-icons">
                <img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" alt="Google">
                <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="GitHub">
                <img src="https://cdn-icons-png.flaticon.com/512/145/145807.png" alt="LinkedIn">
            </div>
            <p>or use your email to sign in</p>
            <form id="signin-form">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="signin-btn">Sign In</button>
            </form>
            <p class="signup-link">Don't have an account? <a href="signup.html">Sign Up</a></p>
        </div>
    </div>

    <script>
        document.getElementById("signin-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!email || !password) {
                alert("Please fill in both fields.");
                return;
            }

            try {
                const res = await fetch("http://localhost:5000/api/auth/signin", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password }),
                });

                const data = await res.json();

                if (res.ok) {
                    // Save token in localStorage after successful login
                    localStorage.setItem("usertoken", data.token);  // Store token
                    alert("Login successful!"); // Inform user of success

                    // Log token to confirm it's working
                    console.log("Token stored in localStorage:", localStorage.getItem("token"));

                    // Redirect to main page
                    window.location.href = "index.html";  
                } else {
                    alert(data.msg || "Invalid credentials. Please try again.");
                }
            } catch (error) {
                alert("Error connecting to the server. Please try again later.");
                console.error(error);
            }
        });
    </script>
</body>
</html>
