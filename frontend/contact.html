<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Etech Counseling</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
</head>
<body class="bg-gray-100">
    <header class="bg-purple-600 p-4 text-white text-center">
        <h1 class="text-3xl font-bold">Etech Counseling - Contact Us</h1>
    </header>

    <main class="flex justify-center items-center min-h-screen">
        <div class="bg-white shadow-lg rounded-lg p-8 max-w-lg w-full">
            <h2 class="text-2xl font-semibold mb-4 text-gray-700">Get in Touch</h2>
            <form action="#" method="POST" class="space-y-4">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-600">Your Name</label>
                    <input type="text" id="name" name="name" required class="w-full p-2 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-600">Your Email</label>
                    <input type="email" id="email" name="email" required class="w-full p-2 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label for="message" class="block text-sm font-medium text-gray-600">Message</label>
                    <textarea id="message" name="message" rows="4" required class="w-full p-2 border border-gray-300 rounded-lg"></textarea>
                </div>
                <button type="submit" class="w-full bg-purple-600 text-white p-2 rounded-lg hover:bg-purple-700 transition">Send Message</button>
            </form>

            <div class="mt-8 text-gray-600">
                <p><strong>Email:</strong> support@etech.com</p>
                <p><strong>Phone:</strong> +123 456 7890</p>
                <p><strong>Address:</strong> 123 Etech St, Learning City, ED 12345</p>
            </div>
        </div>
    </main>

    <footer class="bg-purple-600 p-4 text-white text-center">
        <p>&copy; 2025 Etech Counseling. All Rights Reserved.</p>
    </footer>
</body>
</html>
